# This Blueprint intentionally stays on the Free plan and does not add a paid disk.
# Free local files are ephemeral. For durable JSON state, explicitly upgrade the
# existing service, attach a persistent disk at /var/data, and set
# TOURNAMENT_DATA_DIR=/var/data in the service's environment settings.
services:
  - type: web
    name: nith-free-fire-tournament
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: TOURNAMENT_ADMIN_PIN
        sync: false

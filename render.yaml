# This Blueprint intentionally stays on Render Free and does not add paid storage.
# Free local files are ephemeral; durable state still requires an external store or a paid disk.
services:
  - type: web
    name: nith-free-fire-tournament
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: TOURNAMENT_ADMIN_PASSWORD_HASH
        sync: false

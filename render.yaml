services:
  - type: web
    name: nith-free-fire-tournament
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TOURNAMENT_ADMIN_PIN
        sync: false
      - key: MONGODB_URI
        sync: false
